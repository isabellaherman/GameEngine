<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameEngine</title>
<script type="module" src="./main.js"></script>
<style>
  .viewport { flex: 1; min-height: 0; position: relative; }
  .viewport canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
</style>
</head>
<body class="desk">
  <div class="window is-full">
    <div class="window__main">
      <main class="viewport">
        <canvas id="scene" role="img" aria-label="The World: the ground grid with the X axis in red and the Z axis in blue. Drag to orbit, right-drag or Shift-drag to pan, scroll to zoom."></canvas>
      </main>
    </div>
  </div>
</body>
</html>
